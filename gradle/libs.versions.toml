[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
coroutines = "1.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
# Verified against Google Maven metadata rather than memory; 2.12.0 is the current release, its AAR
# declares minSdk 24 (under our 29), and CoroutineWorker, ForegroundInfo and WorkerFactory are all in
# this artifact — the old work-runtime-ktx split is gone.
work = "2.12.0"
libphonenumber = "9.0.40"
# Verified against Google Maven metadata: 1.4.2 is the published release (lastUpdated 2025-12-03), and the
# artifact's own sources jar confirms the exact API Phase 8 reads — ExifInterface(FileDescriptor),
# getAttribute/getAttributeInt/getAttributeDouble/hasAttribute, and getLatLong(): DoubleArray? (the
# float[] overload is the deprecated one). Chosen over the platform android.media.ExifInterface because the
# platform class does not parse the HEIF/HEIC and PNG containers photos actually arrive in on modern
# devices, and a photo map missing half the library is the worse cost of saving one dependency.
coil = "3.6.3"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.2" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
# Verified against Coil's own docs and artifacts for 3.6.3: GIFs are NOT animated by `coil-compose` alone —
# coil-core ships only BitmapFactoryDecoder, BlackholeDecoder and StaticImageDecoder(animated = false), and
# none of the compose artifacts registers a DecoderServiceLoaderTarget. This artifact does, and it selects
# ImageDecoder + AnimatedImageDrawable on API 28+, which at our minSdk 29 is always the path taken. Without
# it a GIF in the viewer renders as a still and looks exactly like a correct GIF right up until it fails to
# move.
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
