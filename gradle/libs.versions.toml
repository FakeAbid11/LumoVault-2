[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
coroutines = "1.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
# Verified against Google Maven metadata rather than memory; 2.12.0 is the current release, its AAR
# declares minSdk 24 (under our 29), and CoroutineWorker, ForegroundInfo and WorkerFactory are all in
# this artifact — the old work-runtime-ktx split is gone.
work = "2.12.0"
libphonenumber = "9.0.40"
# Verified against Google Maven metadata: 1.4.2 is the published release (lastUpdated 2025-12-03), and the
# artifact's own sources jar confirms the exact API Phase 8 reads — ExifInterface(FileDescriptor),
# getAttribute/getAttributeInt/getAttributeDouble/hasAttribute, and getLatLong(): DoubleArray? (the
# float[] overload is the deprecated one). Chosen over the platform android.media.ExifInterface because the
# platform class does not parse the HEIF/HEIC and PNG containers photos actually arrive in on modern
# devices, and a photo map missing half the library is the worse cost of saving one dependency.
coil = "3.6.3"
junit = "4.13.2"
# Verified against Google Maven's `androidx/media3/group-index.xml`: 1.11.1 is the newest published release
# (nothing exists at 1.12.x yet), and its own POM pins every sibling module to the same number, so one version
# here is what keeps exoplayer, ui and common from disagreeing at runtime — a mixed Media3 set does not fail
# the build, it fails playback. The declarations the viewer uses were read from this version's `-sources.jar`
# rather than remembered: `ExoPlayer.Builder(Context)`/`build()`, `MediaItem.fromUri(Uri)`,
# `Player.setMediaItem/prepare/play/pause/seekTo(long)/release/getDuration/getCurrentPosition`,
# `Player.STATE_IDLE|BUFFERING|READY|ENDED`, `Player.Listener.onPlaybackStateChanged/onIsPlayingChanged/onPlayerError`,
# `PlaybackException.errorCode` with its `ERROR_CODE_*` set, and `PlayerView.setPlayer/setUseController`.
# None of those carries `@UnstableApi`, so no opt-in marker and no compiler flag is added for it. `media3-ui`
# is here for `PlayerView` alone, which is what retires the hand-written `SurfaceHolder.Callback`: Media3's
# `ExoPlayerImpl` registers that callback itself and nulls the video output on `surfaceDestroyed`.
# One collision checked rather than assumed: `media3-common` brings full Guava, and WorkManager brings
# `com.google.guava:listenablefuture:1.0`, which is the same classes in a smaller jar. Guava's own POM asks
# for `listenablefuture:9999.0-empty-to-avoid-conflict-with-guava`, and Gradle's conflict resolution prefers
# that over 1.0, so D8 sees one definition of `ListenableFuture` and no exclusion is needed here.
media3 = "1.11.1"
# Verified against Maven Central metadata: 6.1.20 is the published release (lastUpdated 2024-08-18) under
# the unchanged `org.osmdroid` group — `maps.osmdroid` is a 404. Its POM declares NO dependencies at all, so
# this is one AAR with no transitive weight, Java 8 bytecode, and a manifest that adds no permission and no
# component. It ships no clustering in any version (checked against 6.0.2, 6.1.8 and 6.1.20), which is why
# the clusters here are ours — see domain/map/MapClustering.kt.
osmdroid = "6.1.20"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.2" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
# Verified against Coil's own docs and artifacts for 3.6.3: GIFs are NOT animated by `coil-compose` alone —
# coil-core ships only BitmapFactoryDecoder, BlackholeDecoder and StaticImageDecoder(animated = false), and
# none of the compose artifacts registers a DecoderServiceLoaderTarget. This artifact does, and it selects
# ImageDecoder + AnimatedImageDrawable on API 28+, which at our minSdk 29 is always the path taken. Without
# it a GIF in the viewer renders as a still and looks exactly like a correct GIF right up until it fails to
# move.
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Three modules, and only three: `exoplayer` for the player, `common` for the `Player`/`MediaItem`/
# `PlaybackException` types the app names directly, `ui` for `PlayerView`. No `media3-session` (no background
# playback and no media notification, so nothing to publish a session to), no `media3-datasource-okhttp` or
# any network module (every clip LumoVault plays is a local `content://` file), no `media3-cast`,
# `media3-extractor`/`container`/`decoder`/`datasource` which `media3-exoplayer` already brings itself.
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
