# TdApi.java is generated from the whole TDLib scheme and pulls in several thousand small classes with
# their javadoc, which is more than the 2 GB default the foundation libraries were happy with. The
# runner has room; the build does not have to.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Android Lint parses every source file through IntelliJ's PSI, and PSI refuses files larger than
# `idea.max.intellisense.filesize` (2500 KiB by default) — it hands lint a *plain text* file instead,
# which lint then reports as `LintError` and fails the build on (see DefaultUastParser.kt). TDLib's
# generated TdApi.java is ~5 MB, so out of the box lint cannot read it at all: the first run failed on
# that one file and on nothing else. The limit is read from the JVM that runs lint, and Gradle applies
# `systemProp.` entries to exactly that JVM; build.yml repeats it as `-D` so the command line agrees
# with this file. It has to clear the largest generated file this build fetches, not today's size only.
systemProp.idea.max.intellisense.filesize=32768
