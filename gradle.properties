org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Bump when GitHub Actions restores a stale compile cache that reports
# already-fixed errors (the FolderSelectionScreen ghost). Any change to this
# file invalidates the cache and forces a fresh compile.
cacheBust=2
