name: Build TDLib

# Compiles the official TDLib (github.com/tdlib/td) with the JNI interface for
# the ABIs the app ships, then commits libtdjni.so + the generated Java
# bindings into tdlib-prebuilt/ so the app build never compiles C++.
#
# Expensive (~20-40 min per ABI on a 2-core runner). Runs only on manual
# dispatch or when this file changes; output is cached and committed once.

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "TDLib git tag or commit"
        required: false
        default: "d1085f9cebc5a62379991ae1652673954f229c1f"
  push:
    paths:
      - ".github/workflows/tdlib-build.yml"

env:
  # TDLib's last tagged release (v1.8.0, 2023) predates the 1.8.15 the
  # Flutter app shipped, so master is pinned to a specific commit instead.
  TDLIB_REF: ${{ github.event.inputs.tdlib_ref || 'd1085f9cebc5a62379991ae1652673954f229c1f' }}
  NDK_VERSION: "23.2.8568313"
  CMAKE_VERSION: "3.22.1"
  # Only the ABIs the app packages; upstream builds four.
  ABIS: "arm64-v8a x86_64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmake;${{ env.CMAKE_VERSION }} platforms;android-34 ndk;${{ env.NDK_VERSION }}'

      - name: Install TDLib build tools
        # check-environment.sh requires PHP, perl and gperf.
        run: sudo apt-get update && sudo apt-get install -y php-cli perl gperf

      - name: Cache TDLib sources
        uses: actions/cache@v4
        with:
          path: td
          key: tdlib-src-${{ env.TDLIB_REF }}

      - name: Clone TDLib
        run: |
          if [ ! -d td/.git ]; then
            git clone --filter=blob:none "$TDLIB_REF_URL" td
            git -C td checkout "$TDLIB_REF"
          else
            git -C td fetch origin
            git -C td checkout "$TDLIB_REF"
          fi
        env:
          TDLIB_REF_URL: https://github.com/tdlib/td.git

      - name: Restrict ABIs to the ones the app ships
        run: |
          # Upstream hardcodes four; patching the loop keeps CI from building
          # two ABIs that would never be packaged.
          cd td/example/android
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in ${{ env.ABIS }} ; do/' build-tdlib.sh
          grep -n "for ABI in" build-tdlib.sh

      - name: Build OpenSSL for Android
        working-directory: td/example/android
        run: ./build-openssl.sh "$ANDROID_HOME" "$NDK_VERSION"

      - name: Build TDLib (JNI interface)
        working-directory: td/example/android
        run: ./build-tdlib.sh "$ANDROID_HOME" "$NDK_VERSION" "third-party/openssl"

      - name: Collect prebuilt library and Java bindings
        run: |
          set -e
          mkdir -p tdlib-prebuilt/src/main/java/org/drinkless/tdlib
          # libtdjni.so per ABI. TDLib leaves the .so in both <abi>/ and an
          # intermediate build-<abi>-Java/ tree; only the former is a valid
          # jniLibs ABI directory name, so skip the intermediates. Falling
          # back to find (rather than a hardcoded build path) keeps this
          # working if upstream relocates the output.
          find td -name 'libtdjni.so' -print0 | while IFS= read -r -d '' so; do
            case "$so" in
              */build-*Java/*) echo "skipping intermediate: $so"; continue ;;
            esac
            abi=$(basename "$(dirname "$so")")
            mkdir -p "tdlib-prebuilt/$abi"
            cp "$so" "tdlib-prebuilt/$abi/"
          done
          # Generated org.drinkless.tdlib Client + TdApi sources
          find td -path '*org/drinkless/tdlib/Client.java' -print0 | xargs -0 -I{} cp {} tdlib-prebuilt/src/main/java/org/drinkless/tdlib/
          find td -path '*org/drinkless/tdlib/TdApi.java' -print0 | xargs -0 -I{} cp {} tdlib-prebuilt/src/main/java/org/drinkless/tdlib/
          echo "=== tdlib-prebuilt tree ==="
          find tdlib-prebuilt -type f -printf '%s\t%p\n' | sort -k2

      - name: Verify outputs
        run: |
          fail=0
          for abi in $ABIS; do
            [ -f "tdlib-prebuilt/$abi/libtdjni.so" ] || { echo "MISSING libtdjni.so for $abi"; fail=1; }
          done
          [ -f tdlib-prebuilt/src/main/java/org/drinkless/tdlib/Client.java ] || { echo "MISSING Client.java"; fail=1; }
          [ -f tdlib-prebuilt/src/main/java/org/drinkless/tdlib/TdApi.java ] || { echo "MISSING TdApi.java"; fail=1; }
          exit $fail

      - name: Commit prebuilt TDLib
        # The build takes ~40 min, so main usually moves underneath us. The
        # commit only ever touches tdlib-prebuilt/, so a rebase cannot conflict
        # in practice -- but without it the push is rejected and 40 minutes of
        # compile time is lost with the ephemeral runner.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tdlib-prebuilt
          git commit -m "Build official TDLib ($TDLIB_REF, JNI) for $ABIS" || echo "Nothing to commit"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push
