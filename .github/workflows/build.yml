name: Build app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      # Telegram credentials are injected as Gradle properties so they never
      # land in a tracked file. Until these secrets exist, TdLibConfig
      # .hasCredentials is false and the client fails with a clear API_ID_INVALID
      # rather than an obscure TDLib error.
      - name: Write Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            mkdir -p ~/.gradle
            printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
              "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" >> ~/.gradle/gradle.properties
          fi

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-assemble.log

      # Publishes Kotlin compile errors into the job summary, which is publicly
      # readable without an auth token — the raw log API is not.
      - name: Summarize compile errors
        if: failure()
        run: |
          {
            echo "## Compile errors"
            grep -E "^e: |error: " gradle-assemble.log | head -100 || echo "(no error lines matched)"
            echo "## Log tail"
            tail -60 gradle-assemble.log
          } >> "$GITHUB_STEP_SUMMARY"

      # Pushes the trimmed log to the ci-logs branch (never main, so this does
      # not re-trigger the workflow) where it is publicly readable via
      # raw.githubusercontent.com.
      - name: Save failure log to ci-logs branch
        if: failure()
        run: |
          grep -E "^e: |error: |FAILURE: Build|What went failed|Caused by" gradle-assemble.log | head -300 > ci-errors.txt
          echo '--- TAIL ---' >> ci-errors.txt
          tail -120 gradle-assemble.log >> ci-errors.txt
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add ci-errors.txt
          git commit -m "ci failure log for ${GITHUB_SHA::7}"
          git push origin "HEAD:ci-logs" --force

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumovault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
