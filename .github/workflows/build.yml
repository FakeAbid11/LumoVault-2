name: Build app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      # Telegram credentials are injected as Gradle properties so they never
      # land in a tracked file. Until these secrets exist, TdLibConfig
      # .hasCredentials is false and the client fails with a clear API_ID_INVALID
      # rather than an obscure TDLib error.
      - name: Write Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            mkdir -p ~/.gradle
            printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
              "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" >> ~/.gradle/gradle.properties
          fi

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumovault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
